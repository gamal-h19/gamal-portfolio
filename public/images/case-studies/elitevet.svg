<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <!-- Blueprint Background -->
  <rect width="800" height="450" fill="#090a0c" />
  
  <defs>
    <pattern id="grid-pattern-elitevet" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <radialGradient id="glow-elitevet" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </radialGradient>
    <linearGradient id="card-grad-elitevet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111216" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Grid & Glow -->
  <rect width="800" height="450" fill="url(#grid-pattern-elitevet)" />
  <rect width="800" height="450" fill="url(#glow-elitevet)" />

  <!-- Outer Technical Blueprint Border -->
  <rect x="24" y="24" width="752" height="402" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  
  <!-- Corner Precision Crosses -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8">
    <path d="M 20 24 H 28 M 24 20 V 28" />
    <path d="M 772 24 H 780 M 776 20 V 28" />
    <path d="M 20 426 H 28 M 24 422 V 430" />
    <path d="M 772 426 H 780 M 776 422 V 430" />
  </g>

  <!-- Header Technical Bar -->
  <g font-family="monospace" font-size="11" letter-spacing="1">
    <line x1="24" y1="64" x2="776" y2="64" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <!-- Left: Clinical Queue & Electronic Medical Record -->
  <g transform="translate(48, 84)">
    <rect width="320" height="315" rx="4" fill="url(#card-grad-elitevet)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <g transform="translate(18, 20)">
      <rect x="220" y="-3" width="64" height="18" rx="2" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    </g>
    <line x1="18" y1="42" x2="302" y2="42" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- Queue Patients -->
    <g transform="translate(18, 54)">
      <!-- Patient 1 -->
      <g>
        <rect width="284" height="46" rx="3" fill="#191c24" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <circle cx="20" cy="23" r="5" fill="#10b981" />
        <rect x="214" y="14" width="58" height="18" rx="2" fill="#10b981" fill-opacity="0.15" />
      </g>

      <!-- Patient 2 -->
      <g transform="translate(0, 54)">
        <rect width="284" height="46" rx="3" fill="#191c24" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <circle cx="20" cy="23" r="5" fill="#f59e0b" />
        <rect x="214" y="14" width="58" height="18" rx="2" fill="#f59e0b" fill-opacity="0.15" />
      </g>

      <!-- Patient 3 -->
      <g transform="translate(0, 108)">
        <rect width="284" height="46" rx="3" fill="#191c24" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <circle cx="20" cy="23" r="5" fill="#71717a" />
        <rect x="214" y="14" width="58" height="18" rx="2" fill="#71717a" fill-opacity="0.15" />
      </g>
    </g>

    <!-- SOAP Consultation Note Wireframe -->
    <g transform="translate(18, 226)">
      <rect width="284" height="66" rx="3" fill="#171920" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="264" cy="33" r="6" fill="#10b981" fill-opacity="0.2" />
      <circle cx="264" cy="33" r="2.5" fill="#10b981" />
    </g>
  </g>

  <!-- Right: Pharmaceutical Inventory Engine & Batch Tracking -->
  <g transform="translate(390, 84)">
    <rect width="362" height="315" rx="4" fill="url(#card-grad-elitevet)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    
    <g transform="translate(20, 20)">
    </g>
    <line x1="20" y1="38" x2="342" y2="38" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

    <!-- Batch Tracking Table -->
    <g transform="translate(20, 52)">
      <!-- Row 1 -->
      <g>
        <rect width="322" height="48" rx="3" fill="#171a22" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <rect x="230" y="15" width="80" height="18" rx="2" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 56)">
        <rect width="322" height="48" rx="3" fill="#171a22" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <rect x="230" y="15" width="80" height="18" rx="2" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 112)">
        <rect width="322" height="48" rx="3" fill="#171a22" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
        <rect x="230" y="15" width="80" height="18" rx="2" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
      </g>
    </g>

    <!-- Dispensing Safeguard Notice -->
    <g transform="translate(20, 226)">
      <rect width="322" height="66" rx="3" fill="#161920" stroke="#10b981" stroke-opacity="0.2" stroke-width="1" />
    </g>
  </g>
</svg>
